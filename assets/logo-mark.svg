<!--
  SwitzerHealth icon mark — the "S" formed of two arcs with an ECG trace.

  NOTE: this is a hand-reconstruction traced from the brand book artwork, not
  the official vector file. Replace it with the master SVG from the marketing
  team before launch. It uses `currentColor`, so whatever replaces it should
  too — the header, footer, and dark surfaces all recolor it via CSS.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="SwitzerHealth">
  <g fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Top bar sweeping into the upper-left arc -->
    <path d="M 306 89 L 150 89 A 60 60 0 0 0 90 149 L 90 176" />
    <!-- Middle bar, ECG trace, middle bar -->
    <path d="M 90 199 L 158 199 L 188 112 L 220 286 L 246 199 L 306 199" />
    <!-- Bottom bar sweeping into the lower-right arc -->
    <path d="M 90 311 L 246 311 A 60 60 0 0 0 306 251 L 306 224" />
  </g>
</svg>
