# SwitzerHealth signup site — Netlify configuration
#
# There is no build step. The repository root IS the deployable site.

[build]
  publish = "."
  command = ""

# --- Security headers --------------------------------------------------------
# The CSP is deliberately strict: this site loads no third-party scripts, fonts,
# frames, or images, so there is nothing to allow. `style-src` permits inline
# styles because a handful of one-off layout values are set with the `style`
# attribute; everything else is 'self' only.
#
# The two exceptions are the intake endpoint. Submissions go from the browser
# straight to a Power Automate HTTP trigger, so `connect-src` has to allow the
# fetch() from flow.js and `form-action` has to allow the native POST from the
# no-JavaScript fallback forms. Without both, submissions fail silently in a
# way that looks exactly like a network problem.
#
# `prod-NN.<region>.logic.azure.com` is the shape of a Power Automate trigger
# host; the number and region are assigned when the flow is created. Narrow the
# wildcard to the exact host once the flow exists — it does not change unless
# the flow is recreated. Tenants on GCC/GCC High use *.logic.azure.us instead.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.logic.azure.com; form-action 'self' https://*.logic.azure.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Pages that can contain a person's answers or confirmation should never be
# indexed, even though they are not linked from anywhere public.
[[headers]]
  for = "/flow.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- Friendly URLs -----------------------------------------------------------
[[redirects]]
  from = "/qualify"
  to = "/flow.html"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/flow.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301
